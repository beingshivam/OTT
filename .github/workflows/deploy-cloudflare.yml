name: Deploy to Cloudflare

# Cloudflare's dashboard integration builds on push, but from outside it there
# is no way to see whether a build ran, what it built, or why it didn't — which
# turned "is my fix live?" into guesswork twice in one evening. This does the
# same deploy from CI, where the log is visible, the commit is named, and the
# run can be started on demand rather than only by pushing.
#
# It coexists with the dashboard integration: both call the same Worker and the
# last deploy wins. Turn the dashboard one off if the duplication is noisy.

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Only the default branch publishes — resolved at run time rather than
    # hardcoded, so this keeps working whatever that branch is renamed to.
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GITHUB_SHA is already in the environment, so the build stamps itself
      # with the commit being deployed and /build.txt can be checked afterwards.
      - name: Build
        id: build
        run: npm run build

      # Cannot block the deploy — Cloudflare's dashboard integration publishes
      # on push whatever happens here — so this exists to turn a regression into
      # a red run rather than something a reader finds first. It drives the
      # build that was just produced, in a real browser, at thirteen widths.
      - name: Test
        run: |
          npm run typecheck
          npm run test:rail
          npm run test:affiliates
          npm run test:worker
          npm run eval
          # The library comes from package.json; this fetches the browser
          # binary it drives, which is not an npm package. Pinned by the
          # library's own version so the two cannot drift.
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Keep the screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .e2e/
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN:  ${#TOKEN} characters"
          echo "CLOUDFLARE_ACCOUNT_ID: ${#ACCOUNT} characters"
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No Cloudflare credentials::This job built the site but cannot publish it. Add two repository secrets under Settings › Secrets and variables › Actions: CLOUDFLARE_API_TOKEN (Cloudflare dashboard › My Profile › API Tokens › Create Token › 'Edit Cloudflare Workers') and CLOUDFLARE_ACCOUNT_ID (shown in the Workers overview sidebar). Until then the dashboard integration remains the only thing deploying."
          fi

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pinned rather than @latest: a deploy tool that changes under you is a
        # deploy that breaks on a day you changed nothing.
        run: npx --yes wrangler@4 deploy

      # Closes the loop the whole exercise was about — and it is not gated on
      # the Cloudflare credentials, because it does not need them. It is an HTTP
      # GET against the live site, and the thing most worth catching is exactly
      # the case where *this* job published nothing: the dashboard's own Workers
      # Build is what deploys, and until now nothing checked what it produced.
      # Fifty-two runs reported success while this step sat skipped.
      - name: Verify what is actually live
        if: always() && steps.build.outcome == 'success'
        env:
          SITE: ${{ vars.DEPLOY_CHECK_URL || 'https://newonott.in' }}
        run: |
          echo "Asking $SITE what it is serving…"

          # 1. Is it serving this commit? Workers Builds may land after this job
          #    starts, so give it a few minutes before calling it a failure.
          live=""
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS --max-time 20 "$SITE/build.txt" | awk '/^commit/ { print $2 }' || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            echo "  attempt $attempt: live=${live:-<no build.txt>} want=${GITHUB_SHA:0:8} — waiting"
            sleep $((attempt * 15))
          done

          # 2. Does the app actually boot? Every page ships prerendered markup
          #    that React replaces on mount, so a broken bundle does not 404 —
          #    it renders the fallback, which looks like a plain unstyled list of
          #    titles and is easy to mistake for a styling bug. With the SPA
          #    fallback on, a missing asset is served index.html instead, and the
          #    browser refuses to run HTML as a module. So: fetch the bundle the
          #    page references and check it came back as JavaScript.
          html=$(curl -fsS --max-time 20 "$SITE/" || true)
          asset=$(printf '%s' "$html" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          if [ -z "$asset" ]; then
            echo "::error title=No script tag::$SITE/ does not reference an app bundle at all."
            exit 1
          fi
          ctype=$(curl -fsS --max-time 20 -o /dev/null -w '%{content_type}' "$SITE$asset" || true)
          echo "  bundle $asset -> ${ctype:-<unreachable>}"
          case "$ctype" in
            *javascript*|*ecmascript*) ;;
            *)
              echo "::error title=The app cannot boot::$SITE$asset came back as '${ctype:-nothing}' rather than JavaScript. The SPA fallback serves index.html for assets that are missing, so the browser refuses to execute it and the page renders its prerendered fallback — a plain unstyled list of titles. The deploy is missing its assets."
              exit 1
              ;;
          esac

          # 3. What is it telling caches to do? _headers is applied by
          #    Cloudflare, not by anything in this repo, and its rules are
          #    matched against request paths — so a rule for "/index.html"
          #    silently governed nothing, because no browser asks for that. A
          #    stale page held anywhere in the middle points at hashed asset
          #    URLs that no longer exist, which is one of the ways this site
          #    can look broken while being served perfectly. Print both, so the
          #    rule is checked against reality rather than against memory.
          page_cc=$(curl -fsSI --max-time 20 "$SITE/" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control" { print $2 }')
          asset_cc=$(curl -fsSI --max-time 20 "$SITE$asset" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control" { print $2 }')
          echo "  page   cache-control: ${page_cc:-<none>}"
          echo "  bundle cache-control: ${asset_cc:-<none>}"
          case "$page_cc" in
            *no-store*|*no-cache*|*must-revalidate*) ;;
            *)
              echo "::warning title=Pages are cacheable without revalidation::$SITE/ returned 'Cache-Control: ${page_cc:-nothing}'. A cache that holds this page will keep asking for asset filenames that the next deploy deletes, and the site will render its unstyled fallback until the copy expires. Cloudflare's default for static assets used to supply this; if it has changed, _headers needs a rule for it — see the note in public/_headers about rules being added rather than replaced."
              ;;
          esac
          # Cloudflare adds the headers from every matching _headers rule, so two
          # rules that both match one file produce one header carrying both
          # values — which is how the year-long cache on hashed assets was
          # cancelled by a broad default sitting above it. A client may honour
          # either value, so this is a real difference in behaviour, not
          # cosmetic.
          if [ "$(printf '%s' "$asset_cc" | grep -o 'max-age' | wc -l)" -gt 1 ]; then
            echo "::warning title=Contradictory cache header on assets::$SITE$asset returned 'Cache-Control: $asset_cc'. Two _headers rules match this path and their values were combined. Make the rules disjoint."
          fi

          # 4. Is the loading check reachable? It is the one page a reader on a
          #    filtered network is sent to, so it has to resolve as its own file
          #    rather than being swallowed by the SPA fallback — which is exactly
          #    what a local static server did on the first attempt at this path.
          diag=$(curl -fsS --max-time 20 "$SITE/diag/" || true)
          case "$diag" in
            *"Loading check"*) echo "  /diag/ resolves" ;;
            *) echo "::error title=The loading check is unreachable::$SITE/diag/ did not return the check page. The banner shown to a reader whose assets were blocked links there, so it has to resolve." ; exit 1 ;;
          esac

          # 5. Does the poster proxy answer? The share card's artwork goes
          #    through the Worker because image.tmdb.org sends no CORS header,
          #    and a canvas cannot read back what it drew from there. If this
          #    route stops working the cards do not break — they quietly render
          #    coloured gradients instead of posters, which is exactly the kind
          #    of failure nobody reports.
          poster=$(printf '%s' "$html" | grep -o 'image\.tmdb\.org/t/p/[^"]*' | head -1 | sed 's|image\.tmdb\.org/t/p||')
          if [ -n "$poster" ]; then
            ptype=$(curl -fsS --max-time 20 -o /dev/null -w '%{content_type}' "$SITE/img$poster" || true)
            echo "  /img$poster -> ${ptype:-<unreachable>}"
            case "$ptype" in
              image/*) ;;
              *) echo "::warning title=The poster proxy is not serving images::$SITE/img$poster returned '${ptype:-nothing}'. Poster share cards will fall back to generated art instead of real artwork." ;;
            esac
          fi

          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::error title=Live site is not this commit::$SITE/build.txt reports '${live:-nothing}' rather than ${GITHUB_SHA:0:8}. The bundle loads, so the site works — it is just serving an older deploy."
            exit 1
          fi
          echo "::notice title=Deploy confirmed::$SITE is serving ${GITHUB_SHA:0:8} and its bundle loads as $ctype."
