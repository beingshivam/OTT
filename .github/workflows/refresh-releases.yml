name: Refresh release calendar

# New titles land on Friday in India and midweek almost everywhere else, so the
# calendar is rebuilt twice a week rather than once. Times are UTC.
on:
  schedule:
    - cron: '30 19 * * 4' # Thu 19:30 UTC — Friday ~01:00 IST, ahead of the Friday drops
    - cron: '30 19 * * 1' # Mon 19:30 UTC — Tuesday ~01:00 IST, for the midweek additions
  workflow_dispatch:
    inputs:
      weeks_back:
        description: 'Weeks of history to backfill'
        default: '2'
      weeks_ahead:
        description: 'Weeks of upcoming releases to pull'
        default: '2'

concurrency:
  group: refresh-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Without a token there is nothing to fetch. That is a configuration gap,
      # not a broken build, so the job says so and stops green.
      # Reports *where* the credential is, not just whether it's missing. The
      # value is never printed — only its length — so the log stays safe to share.
      - name: Check for TMDB credentials
        id: creds
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_TOKEN_VAR: ${{ vars.TMDB_TOKEN }}
        run: |
          echo "Repository secret TMDB_TOKEN: ${#TMDB_TOKEN} characters"
          echo "Repository variable TMDB_TOKEN: ${#TMDB_TOKEN_VAR} characters"

          if [ -n "$TMDB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -n "$TMDB_TOKEN_VAR" ]; then
            echo "::warning title=Token is in the wrong place::TMDB_TOKEN was found under the Variables tab, not Secrets. Variables are printed in plain text in logs, so this job will not read a credential from there. Delete the variable and re-add it under Settings › Secrets and variables › Actions › Secrets › New repository secret."
          else
            echo "::notice title=No TMDB token::Nothing found in either Secrets or Variables. Add it at Settings › Secrets and variables › Actions › Secrets tab › New repository secret, named exactly TMDB_TOKEN. Environment secrets and Dependabot secrets are not visible to this job."
          fi

      - name: Rebuild the feed
        if: steps.creds.outputs.ready == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          REGIONS: ${{ vars.REGIONS || 'IN,US' }}
        run: |
          node scripts/fetch-releases.mjs \
            --weeks-back "${{ inputs.weeks_back || 2 }}" \
            --weeks-ahead "${{ inputs.weeks_ahead || 2 }}"

      # Separate pass so curated rows — which discover never returns — still get
      # posters, synopses, cast and runtimes attached.
      - name: Attach artwork and metadata
        if: steps.creds.outputs.ready == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/enrich-releases.mjs

      - name: Commit the updated calendar
        if: steps.creds.outputs.ready == 'true'
        run: |
          if git diff --quiet -- public/data/releases.json; then
            echo "::notice::Calendar already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/releases.json
          git commit -m "chore(data): refresh release calendar"
          git push
