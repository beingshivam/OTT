name: Refresh release calendar

# Three runs a week, and the third one is the point.
#
# TMDB assigns a streaming provider *after* a title is available — the reason
# scripts/fetch-releases.mjs has to ask for theatrical dates separately. So a
# refresh that lands before Friday's drops cannot know which service they went
# to: it gets the cinema listings right, because those dates are announced weeks
# ahead, and leaves that day's streaming arrivals unplaced. A run on Friday
# morning alone would therefore be freshest exactly when it knows least about
# the day it is describing.
#
# Hence Saturday. Friday morning flips the week and keeps the page honest on the
# day most people look; Saturday morning is what actually fills in where Friday
# landed, before the weekend is spent deciding; Monday evening picks up the
# weekend's corrections and the week taking shape.
#
# Times are UTC and the comments give IST, because that is the audience.
# Scheduled workflows only ever run on the repository's default branch — if the
# default branch changes, this schedule moves with it.
on:
  schedule:
    - cron: '30 2 * * 5'  # Fri 02:30 UTC — Friday 08:00 IST, the week flips
    - cron: '30 4 * * 6'  # Sat 04:30 UTC — Saturday 10:00 IST, Friday's drops now have providers
    - cron: '30 13 * * 1' # Mon 13:30 UTC — Monday 19:00 IST, the weekend and the week ahead
  workflow_dispatch:
    inputs:
      weeks_back:
        description: 'Weeks of history to backfill'
        default: '3'
      weeks_ahead:
        description: 'Weeks of upcoming releases to pull'
        default: '4'

concurrency:
  group: refresh-releases
  cancel-in-progress: false

permissions:
  contents: write
  # For the report below, which is how a person finds out this ran.
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reports *where* the credential is, not just whether it's missing. The
      # value is never printed — only its length — so the log stays safe to share.
      #
      # This step stays green even with nothing configured, so the diagnostics
      # below always get a chance to print. The staleness guard at the end of the
      # job is what actually turns a missing token into a failure someone hears
      # about.
      - name: Check for TMDB credentials
        id: creds
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_TOKEN_VAR: ${{ vars.TMDB_TOKEN }}
        run: |
          echo "Secret TMDB_TOKEN:   ${#TMDB_TOKEN} characters"
          echo "Secret TMDB_API_KEY: ${#TMDB_API_KEY} characters"
          echo "Variable TMDB_TOKEN: ${#TMDB_TOKEN_VAR} characters"

          # Either credential works — the scripts pick the auth scheme by shape.
          if [ -z "$TMDB_TOKEN" ] && [ -n "$TMDB_API_KEY" ]; then
            TMDB_TOKEN="$TMDB_API_KEY"
          fi

          if [ -n "$TMDB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ -n "$TMDB_TOKEN_VAR" ]; then
            echo "::warning title=Token is in the wrong place::TMDB_TOKEN was found under the Variables tab, not Secrets. Variables are printed in plain text in logs, so this job will not read a credential from there. Delete the variable and re-add it under Settings › Secrets and variables › Actions › Secrets › New repository secret."
          else
            echo "::warning title=No TMDB token::Nothing found in either Secrets or Variables. Add it at Settings › Secrets and variables › Actions › Secrets tab › New repository secret, named exactly TMDB_TOKEN. Environment secrets and Dependabot secrets are not visible to this job."
          fi

      - name: Rebuild the feed
        id: fetch
        if: steps.creds.outputs.ready == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.TMDB_API_KEY }}
          REGIONS: ${{ vars.REGIONS || 'IN,US' }}
        run: |
          node scripts/fetch-releases.mjs \
            --weeks-back "${{ inputs.weeks_back || 3 }}" \
            --weeks-ahead "${{ inputs.weeks_ahead || 4 }}"

      # Separate pass so curated rows — which discover never returns — still get
      # posters, synopses, cast and runtimes attached.
      #
      # Enrichment is decoration: a calendar with the right titles and no posters
      # is still the product, but a calendar frozen three weeks in the past is
      # not. So a failure here must not cost us the refresh that already
      # succeeded — it is recorded and the run carries on to commit.
      - name: Attach artwork and metadata
        id: enrich
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.TMDB_API_KEY }}
        run: node scripts/enrich-releases.mjs

      # IMDb scores, which TMDB cannot supply for a release calendar.
      #
      # A calendar contains nothing but brand-new titles, and a brand-new title
      # has not been voted on: of 183 India rows, 39 carried a TMDB score and 13
      # had enough votes to quote. IMDb has the votes.
      #
      # After enrichment, because that pass is what attaches the IMDb id this
      # one looks up by — and before the archive, so the scores are merged into
      # the permanent record along with everything else.
      #
      # No key configured means this prints why and exits clean, so the refresh
      # is never blocked on a credential that is only ever an improvement.
      #
      # The script stops itself after eight minutes and keeps what it has; this
      # timeout is only the backstop for a hang it cannot see, and is set above
      # its own budget so the clean stop always wins. Being killed here would
      # lose every score fetched, because the feed is written once at the end.
      - name: Attach IMDb scores
        id: ratings
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/enrich-ratings.mjs

      # Provider logos change rarely, but they cost two calls and keep the board
      # branded without shipping anyone's trademarked assets in the repo. Same
      # reasoning as above: nice to have, never worth losing the refresh over.
      - name: Fetch platform logos
        id: logos
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.TMDB_API_KEY }}
        run: node scripts/fetch-logos.mjs

      # The permanent record, updated from the feed that was just rebuilt.
      #
      # The feed is a rolling eight-week window, so without this every title
      # page the build writes has a three-week fuse — the film's week falls off
      # the back and the URL dies. Pages that delete themselves never rank.
      #
      # Runs whenever the fetch succeeded, enriched or not: the merge only
      # writes fields it actually has, so a run that lost enrichment records the
      # new titles without stripping the synopses already stored for the old
      # ones. And like enrichment, it must never cost us a refresh that already
      # worked — the calendar is the product, the archive is what compounds.
      - name: Update the archive
        id: archive
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: node scripts/archive.mjs

      # The back catalogue: what is good and streaming now, whatever its age.
      #
      # A reader asked for this — a release calendar can only ever answer "what
      # is new", and half the time the question is "what is worth watching".
      # It is a separate dataset with a separate shape, deliberately not merged
      # into the calendar, whose whole promise is that everything on it is new.
      #
      # Weekly rather than twice weekly, on the same run as the email: a back
      # catalogue barely moves, and this is the most expensive step here by an
      # order of magnitude — roughly a thousand calls, since TMDB can filter by
      # provider but will not say which one matched, so every title costs one
      # more call to find out where it actually streams.
      - name: Fetch the back catalogue
        id: catalogue
        if: >-
          steps.fetch.outcome == 'success' &&
          (github.event_name != 'schedule' || github.event.schedule == '30 19 * * 4')
        continue-on-error: true
        timeout-minutes: 15
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.TMDB_API_KEY }}
        run: node scripts/fetch-catalogue.mjs --verbose

      # The week's email, assembled from the feed that was just rebuilt. A
      # newsletter dies of the Friday it did not get written, so the draft is
      # ready before anyone has to think about it.
      #
      # Once a week, not twice. The calendar is rebuilt on Monday as well
      # because midweek titles keep appearing and the site should carry them —
      # but a second email in the same week is a second interruption for one
      # week's news, and unsubscribes are the price. So the draft is written
      # only on the Thursday run, the one that lands ahead of Friday's drops.
      # A manual run always writes one, for testing.
      # Matched against the cron that opens the week. This named the old
      # Thursday schedule, which stopped existing when the cadence changed —
      # so on every scheduled run the condition was false and the digest
      # silently stopped being drafted. Nothing failed; a weekly email just
      # quietly wasn't there. A workflow that refers to its own schedule by
      # string is a second copy of the schedule, and it drifted within a day.
      - name: Draft the weekly email
        id: digest
        if: >-
          steps.fetch.outcome == 'success' &&
          (github.event_name != 'schedule' || github.event.schedule == '30 2 * * 5')
        continue-on-error: true
        run: node scripts/build-digest.mjs

      - name: Note any partial pass
        if: steps.enrich.outcome == 'failure' || steps.ratings.outcome == 'failure' || steps.logos.outcome == 'failure' || steps.catalogue.outcome == 'failure' || steps.digest.outcome == 'failure' || steps.archive.outcome == 'failure'
        run: |
          echo "::warning title=Refreshed, but not fully enriched::The calendar itself rebuilt and will be published. Enrichment: ${{ steps.enrich.outcome }}. IMDb scores: ${{ steps.ratings.outcome }}. Logos: ${{ steps.logos.outcome }}. Archive: ${{ steps.archive.outcome }}. Catalogue: ${{ steps.catalogue.outcome }}. Email draft: ${{ steps.digest.outcome }}. TMDB drops connections under load, and the next run picks up whatever was missed — no action needed unless it repeats."

      # Pushing the data is what triggers the Cloudflare build, so this is the
      # step that actually publishes. Rebase first: a human push between the
      # checkout and here would otherwise reject this one and lose the refresh
      # until the next run.
      - name: Commit the updated calendar
        if: steps.fetch.outcome == 'success'
        run: |
          if git diff --quiet -- public/data/releases.json public/data/logos.json data/archive.json public/data/catalogue.json email; then
            echo "::notice::Calendar already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/releases.json public/data/logos.json data/archive.json public/data/catalogue.json email
          git commit -m "chore(data): refresh release calendar"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected — rebasing onto the branch and retrying ($attempt/3)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          echo "::error title=Could not publish the refresh::The calendar rebuilt but could not be pushed after three attempts."
          exit 1

      # The single check that matters, and the reason this job can be left alone.
      #
      # Every way this can quietly stop working — no token, an expired token, a
      # TMDB outage, a broken script, a rejected push — ends the same way: the
      # published feed stops moving while the job still reports success. A notice
      # in a log nobody opens is not a safety net. So the run fails when the feed
      # on disk has gone stale, because a failed scheduled workflow is the one
      # thing GitHub actually emails you about.
      #
      # The window allows a full missed week: three runs land per week, so this
      # only trips after four or five consecutive failures, never on one bad
      # night.
      - name: Guard against a stale calendar
        if: always()
        env:
          MAX_AGE_DAYS: ${{ vars.MAX_FEED_AGE_DAYS || 9 }}
          CREDS_READY: ${{ steps.creds.outputs.ready }}
        run: |
          node -e '
            const fs = require("fs");
            const max = Number(process.env.MAX_AGE_DAYS);
            const feed = JSON.parse(fs.readFileSync("public/data/releases.json", "utf8"));
            const days = (Date.now() - Date.parse(feed.generatedAt)) / 86400000;
            const age = days.toFixed(1);

            // No credential means this job can never refresh anything, however
            // fresh the committed feed still looks today. Say so on the first
            // run rather than waiting for the data to rot into the window below.
            if (process.env.CREDS_READY !== "true") {
              console.log("::error title=The refresh cannot run::No TMDB credential is configured, so this job did nothing and the calendar will freeze where it is. The credentials step above says exactly where to add it.");
              process.exit(1);
            }
            if (feed.source !== "tmdb") {
              console.log(`::error title=The calendar is not live data::The feed still reads source "${feed.source}", so the site is serving the seeded sample rather than real releases. Add the TMDB_TOKEN secret (see the credentials step above) and re-run this workflow.`);
              process.exit(1);
            }
            if (days > max) {
              console.log(`::error title=The calendar has gone stale::Last rebuilt ${age} days ago, past the ${max}-day limit. Open the earlier steps in this run to see which one stopped working — a missing or expired TMDB token is the usual cause.`);
              process.exit(1);
            }
            console.log(`Calendar is ${age} days old — within the ${max}-day limit.`);
          '

      # ---------------------------------------------------------------- report
      #
      # How a person finds out this ran, without adding a credential to the repo.
      #
      # GitHub already emails you when a scheduled workflow *fails*, which is the
      # half that actually matters and the reason the guard above turns a silent
      # stall into a failure. What it never sends is the other half: word that
      # the thing worked. So the job writes to one long-running issue and
      # @mentions the owner, because a mention is the one notification GitHub
      # sends reliably whatever a person's watch settings say — and it needs no
      # SMTP server, no app password and no third-party action holding a secret.
      #
      # Weekly rather than per-run, on purpose. Three "it worked" emails a week
      # is how a person learns to delete them unread, and an alert nobody reads
      # is worse than none: it is the same silence with more noise. Monday's run
      # reports; Friday's and Saturday's stay quiet unless something breaks.
      - name: Report the run
        if: always() && (failure() || github.event_name == 'workflow_dispatch' || github.event.schedule == '30 13 * * 1')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" "$@"; }

          # The numbers a reader of the email would actually want: is it fresh,
          # and how much is in it.
          summary=$(node -e '
            const fs = require("fs");
            const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
            const feed = read("public/data/releases.json");
            const cat  = read("public/data/catalogue.json");
            const arch = read("data/archive.json");
            const rows = feed ? feed.weeks.flatMap((w) => w.releases).length : 0;
            const age  = feed ? ((Date.now() - Date.parse(feed.generatedAt)) / 3600000).toFixed(1) : "?";
            console.log([
              `- **${rows}** releases across ${feed ? feed.weeks.length : 0} weeks, rebuilt ${age}h ago`,
              `- **${cat ? cat.titles.length : 0}** titles in the back catalogue`,
              `- **${arch ? arch.titles.length : 0}** titles in the permanent archive`,
            ].join("\n"));
          ')

          if [ "$OUTCOME" = "success" ]; then
            head="✅ Refresh completed — $(date -u '+%a %d %b %Y, %H:%M UTC')"
          else
            head="⚠️ **Refresh FAILED** — $(date -u '+%a %d %b %Y, %H:%M UTC')"
          fi

          body=$(printf '%s\n\n%s\n\n[Full log](%s)\n\n@%s' "$head" "$summary" "$RUN_URL" "$OWNER")

          # One issue, reused. Found by title so the workflow needs nothing
          # stored anywhere; created on the first run that reports.
          number=$(api "https://api.github.com/repos/$REPO/issues?state=open&per_page=100" \
            | jq -r '[.[] | select(.title == "Refresh log")][0].number // empty')

          if [ -z "$number" ]; then
            number=$(api -X POST "https://api.github.com/repos/$REPO/issues" \
              -d "$(jq -n --arg b "$body" '{
                    title: "Refresh log",
                    body: ("Every refresh reports here. Close this issue to stop the notifications.\n\n---\n\n" + $b)
                  }')" | jq -r '.number')
            echo "Opened the refresh log as issue #$number."
          else
            api -X POST "https://api.github.com/repos/$REPO/issues/$number/comments" \
              -d "$(jq -n --arg b "$body" '{ body: $b }')" > /dev/null
            echo "Reported to issue #$number."
          fi
