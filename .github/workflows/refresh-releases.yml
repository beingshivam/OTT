name: Refresh release calendar

# New titles land on Friday in India and midweek almost everywhere else, so the
# calendar is rebuilt twice a week rather than once. Times are UTC.
on:
  schedule:
    - cron: '30 19 * * 4' # Thu 19:30 UTC — Friday ~01:00 IST, ahead of the Friday drops
    - cron: '30 19 * * 1' # Mon 19:30 UTC — Tuesday ~01:00 IST, for the midweek additions
  workflow_dispatch:
    inputs:
      weeks_back:
        description: 'Weeks of history to backfill'
        default: '2'
      weeks_ahead:
        description: 'Weeks of upcoming releases to pull'
        default: '2'

concurrency:
  group: refresh-releases
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Without a token there is nothing to fetch. That is a configuration gap,
      # not a broken build, so the job says so and stops green.
      - name: Check for TMDB credentials
        id: creds
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::notice::TMDB_TOKEN is not set — skipping. Add it under Settings › Secrets › Actions to enable automatic refreshes."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the feed
        if: steps.creds.outputs.ready == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          REGIONS: ${{ vars.REGIONS || 'IN,US' }}
        run: |
          node scripts/fetch-releases.mjs \
            --weeks-back "${{ inputs.weeks_back || 2 }}" \
            --weeks-ahead "${{ inputs.weeks_ahead || 2 }}"

      # Separate pass so curated rows — which discover never returns — still get
      # posters, synopses, cast and runtimes attached.
      - name: Attach artwork and metadata
        if: steps.creds.outputs.ready == 'true'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: node scripts/enrich-releases.mjs

      - name: Commit the updated calendar
        if: steps.creds.outputs.ready == 'true'
        run: |
          if git diff --quiet -- public/data/releases.json; then
            echo "::notice::Calendar already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/releases.json
          git commit -m "chore(data): refresh release calendar"
          git push
