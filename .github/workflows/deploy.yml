name: Deploy to GitHub Pages

on:
  push:
  # Lets a calendar refresh publish itself without waiting for the next push.
  workflow_run:
    workflows: ['Refresh release calendar']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Only the default branch publishes — resolved at run time rather than
    # hardcoded, so this keeps working whatever that branch is renamed to.
    if: >-
      github.event_name != 'push' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves project sites from /<repo>/, so the bundle needs that base.
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Pages has no SPA fallback; serving index.html as 404.html keeps deep
      # links working even though all state lives in the query string.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      # Turning Pages on requires repo-admin scope, which the Actions token does
      # not have. So detect it rather than fail: until someone enables Pages, the
      # site still builds and the run stays green with an explanatory notice.
      - name: Check whether Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages not enabled::The site built fine but has nowhere to go yet. Enable it once under Settings › Pages › Source: 'GitHub Actions', then re-run this workflow."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
