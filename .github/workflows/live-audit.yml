# What the live site actually does.
#
# The other suites test what was built: unit tests against source, e2e against
# ./dist on a loopback port, the eval gate against the files the build wrote.
# All of them can pass while the site is wrong, because between dist and a
# reader sit a Worker, an edge cache, a deploy that may not have landed and a
# set of secrets that may not be bound. Those are the failures that have
# actually happened here.
#
# Not part of the deploy, and gates no publish — but it does fail when the
# site is wrong, because a scheduled check that cannot fail cannot notify.
# Both edge secrets were unbound for hours one morning (search dead, every
# sheet dead, the staleness alarm mute) and nothing said so; it was found by
# the owner typing a film name into his own site. A red run is the one alert
# left that does not depend on a binding that can itself be wiped.
name: Live audit

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to audit.'
        required: false
        default: 'https://newonott.in'
      sample:
        description: 'Title pages to check — a number, or "all".'
        required: false
        default: '60'
  schedule:
    # 06:40 UTC — 12:10 IST. After the morning refresh has had its grace
    # period, and long before the evening the site is busiest.
    - cron: '40 6 * * *'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ask the site
        env:
          SITE: ${{ inputs.site || 'https://newonott.in' }}
          SAMPLE: ${{ inputs.sample || '60' }}
          # So the report can say whether the site is serving this commit or
          # is still a deploy behind — the difference that has cost the most
          # time here. Only meaningful against the real site.
          EXPECT_SHA: ${{ (inputs.site == '' || inputs.site == 'https://newonott.in') && github.sha || '' }}
        # Fenced, or the summary renders the report as one paragraph.
        #
        # pipefail because the audit's exit code is the whole point of it
        # failing, and a pipeline reports its *last* command — without this
        # the status is tee's, which is always 0, and a red run would never
        # go red. The closing fence runs either way so the summary is still
        # readable on the runs that matter most.
        shell: bash
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/live-audit.mjs | tee -a "$GITHUB_STEP_SUMMARY"; status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
