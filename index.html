<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New on OTT — everything new, everywhere, this week</title>
    <meta
      name="description"
      content="Every film, series and show landing this week across Netflix, Prime Video, JioHotstar, Apple TV+, theatres and more. One page. No login."
    />
    <meta name="theme-color" content="#06070a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="New on OTT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="New on OTT — everything new, everywhere, this week" />
    <meta
      property="og:description"
      content="One page for every new release across every streaming platform and theatres."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff4d4d'/%3E%3Cpath d='M12 9.5c0-1.2 1.3-2 2.4-1.3l9 5.8c1 .6 1 2 0 2.6l-9 5.8c-1.1.7-2.4-.1-2.4-1.3z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!--
      Every poster and platform logo comes from TMDB's CDN, so warm it early.

      Without crossorigin, and that is the whole point of this line. A browser
      keeps separate connection pools for CORS and non-CORS requests to the
      same host, and a preconnect warms only the pool its own attributes
      describe. The posters are plain <img src> tags with no crossorigin
      attribute — PosterArt has never set one, because nothing on the page
      reads a poster back off a canvas — so they are non-CORS requests, and
      this preconnect was warming a connection none of them would ever use.
      The intent in the comment was right and the attribute defeated it: every
      poster still paid full DNS, TCP and TLS setup on the first one.

      Fonts keep theirs, and should: a webfont is fetched in CORS mode whether
      you ask for it or not, so gstatic's preconnect describes the connection
      the fonts actually open.
    -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Say so when the page does not finish loading.

      Every page ships prerendered markup that React replaces on mount, which is
      good for a crawler and for a slow connection and actively bad for a broken
      one: if the stylesheet and the bundle never arrive, the fallback stays on
      screen and the site looks like it was built that way. It was reported as a
      styling bug, not a loading failure, and that cost a week of looking in the
      wrong place.

      Deliberately a classic script, not a module, and deliberately ES5: this
      has to run in exactly the situation where the module did not.

      Two triggers. The listener catches an asset that fails outright and fires
      immediately; the timer catches the quieter version, where the file arrives
      but is the SPA fallback's HTML rather than CSS or JavaScript, so nothing
      errors and nothing runs.

      And two causes, which this used to report as one. A network filter is the
      reason it was written. The other is a deploy: asset filenames are hashed
      and the old ones stop existing the moment a new build lands, so any tab
      holding the previous page asks for a file that is gone, gets index.html
      back from the SPA fallback, and dies exactly as if it had been blocked.
      Reported from a phone minutes after a publish, with the banner
      confidently blaming the reader's network.

      The two are distinguishable. A blocked asset does not answer at all; a
      deleted one answers 200 with HTML, because that is what the fallback
      serves. So ask, and when the answer is HTML this is a stale page rather
      than a filtered one — reload once and the fresh markup names the bundle
      that now exists. Once, guarded in sessionStorage, because a reload loop
      is a worse failure than the banner.
    -->
    <script>
      (function () {
        var shown = false;
        var RELOAD_KEY = 'newonott.staleReload';

        function reloadedAlready() {
          try {
            return sessionStorage.getItem(RELOAD_KEY) === '1';
          } catch (err) {
            // Private mode, or storage refused. Treat as "already tried", so
            // the worst case is the banner rather than a reload loop.
            return true;
          }
        }

        function rememberReload() {
          try {
            sessionStorage.setItem(RELOAD_KEY, '1');
          } catch (err) {}
        }

        /**
         * Is this a page the deploy left behind, rather than a blocked one?
         *
         * A deleted asset comes back 200 with the SPA fallback's HTML. A
         * filtered one does not come back at all. Only the first is worth
         * reloading for, and only once.
         */
        function recoverIfStale(src, whenNot) {
          if (!src || src.indexOf('/assets/') === -1 || reloadedAlready() || !window.fetch) {
            whenNot();
            return;
          }
          fetch(src, { cache: 'reload' })
            .then(function (res) {
              var type = res.headers.get('content-type') || '';
              if (res.ok && type.indexOf('text/html') !== -1) {
                rememberReload();
                location.reload();
                return;
              }
              whenNot();
            })
            .catch(function () {
              whenNot();
            });
        }

        function warn(detail) {
          if (shown) return;
          shown = true;
          var el = document.createElement('div');
          el.setAttribute(
            'style',
            'position:fixed;left:0;right:0;top:0;z-index:2147483647;padding:12px 16px;' +
              'background:#2a1214;border-bottom:1px solid #ff4d4d55;color:#ffd9d9;' +
              "font:14px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",
          );
          el.innerHTML =
            '<strong>This page did not finish loading.</strong> Its stylesheet and app code were ' +
            'stopped before they reached the browser — usually a network filter between you and ' +
            'the site, not the site itself. ' +
            '<a href="/diag" style="color:#ff9f9f">Run the check</a> to see what was blocked.';
          (document.body || document.documentElement).appendChild(el);
          // Fixed, so it stays put while the reader scrolls the fallback list —
          // which means making room for it rather than covering the heading.
          document.documentElement.style.paddingTop = el.offsetHeight + 'px';
        }

        // Capture phase: resource load failures do not bubble.
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return; // A script threw; that is a different problem.
            var src = t.src || t.href || '';
            if (src.indexOf('/assets/') !== -1) {
              recoverIfStale(src, function () {
                warn(src);
              });
            }
          },
          true,
        );

        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root) return;
          // React has replaced the prerendered markup by now, or it never will.
          if (root.querySelector('.seo-fallback') || !root.firstChild) {
            /* The quiet version: the file arrived and was HTML, so nothing
               errored. Ask about the bundle this page names. */
            var tag = document.querySelector('script[src*="/assets/"]');
            recoverIfStale(tag && tag.src, function () {
              warn('timeout');
            });
          }
        }, 8000);
      })();
    </script>
  </body>
</html>
