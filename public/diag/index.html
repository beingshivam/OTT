<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Loading check — New on OTT</title>

    <!--
      Why this page exists.

      The site renders on every machine it has been tested on and does not
      render on one particular work laptop, where it shows its prerendered text
      with no styling. From the outside that is unfalsifiable: the origin serves
      the right bytes with the right content type, and every check from a normal
      network passes. The only place the answer exists is on the machine that
      has the problem.

      So this page runs, in the browser that is failing, the same requests the
      real page makes, and reports exactly what comes back. It is plain ES5 with
      inline styles and no external anything — it has to work in the situation
      where the real page does not, which rules out modules, a stylesheet, and
      a web font.

      Nothing here is sent anywhere. It prints a report and offers to copy it.
    -->
    <style>
      html { background: #06070a; }
      body {
        margin: 0; padding: 28px 20px 60px; color: #d7dbe4; background: #06070a;
        font: 15px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap { max-width: 820px; margin: 0 auto; }
      h1 { font-size: 22px; margin: 0 0 6px; color: #f2f4f9; }
      .lede { color: #8d94a4; margin: 0 0 26px; }
      .verdict { padding: 14px 16px; border-radius: 10px; margin: 0 0 22px; display: none; }
      .verdict.bad { display: block; background: #2a1214; border: 1px solid #ff4d4d55; color: #ffd9d9; }
      .verdict.good { display: block; background: #0e2016; border: 1px solid #3ddc9755; color: #cdf5e3; }
      .verdict.warn { display: block; background: #241d0e; border: 1px solid #ffb03a55; color: #f7e6c5; }
      .row { border-top: 1px solid #ffffff14; padding: 11px 0; display: flex; gap: 12px; align-items: baseline; }
      .row b { flex: none; width: 34px; font-weight: 400; }
      .row .what { flex: 1 1 auto; }
      .row .detail { display: block; color: #8d94a4; font-size: 13px; word-break: break-all; }
      .ok b { color: #3ddc97; }
      .bad b { color: #ff6b6b; }
      .info b { color: #6a7080; }
      button {
        margin-top: 24px; padding: 10px 16px; border-radius: 8px; cursor: pointer;
        background: #1a1d25; color: #f2f4f9; border: 1px solid #ffffff22; font: inherit;
      }
      textarea {
        width: 100%; height: 220px; margin-top: 14px; padding: 12px; box-sizing: border-box;
        background: #0a0c12; color: #8d94a4; border: 1px solid #ffffff14; border-radius: 8px;
        font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      a { color: #ff9f9f; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Loading check</h1>
      <p class="lede">
        Running the requests the site makes, from this browser, on this network. Takes a few seconds.
      </p>
      <div class="verdict" id="verdict"></div>
      <div id="rows"></div>
      <button type="button" id="copy">Copy this report</button>
      <textarea id="report" readonly></textarea>
    </div>

    <script>
      (function () {
        var rows = document.getElementById('rows');
        var lines = [];

        function add(status, what, detail) {
          var el = document.createElement('div');
          el.className = 'row ' + status;
          el.innerHTML =
            '<b>' + (status === 'ok' ? 'ok' : status === 'bad' ? '✕' : '·') + '</b>' +
            '<span class="what"></span>';
          var w = el.querySelector('.what');
          w.appendChild(document.createTextNode(what));
          if (detail) {
            var d = document.createElement('span');
            d.className = 'detail';
            d.appendChild(document.createTextNode(detail));
            w.appendChild(d);
          }
          rows.appendChild(el);
          lines.push((status === 'ok' ? '[ok]  ' : status === 'bad' ? '[FAIL]' : '[--]  ') +
            ' ' + what + (detail ? '\n         ' + detail : ''));
          document.getElementById('report').value = lines.join('\n');
        }

        function verdict(kind, text) {
          var v = document.getElementById('verdict');
          v.className = 'verdict ' + kind;
          v.innerHTML = '';
          v.appendChild(document.createTextNode(text));
          lines.unshift('VERDICT: ' + text + '\n');
          document.getElementById('report').value = lines.join('\n');
        }

        /**
         * One request, described.
         *
         * fetch is preferred because it reports redirects and the final URL,
         * which is the whole question when something sits in the middle. XHR is
         * the fallback, and a browser old enough to need it is itself a finding.
         */
        function get(url, opts, done) {
          opts = opts || {};
          if (window.fetch) {
            var init = { cache: opts.cache || 'default' };
            if (opts.redirect) init.redirect = opts.redirect;
            window
              .fetch(url, init)
              .then(function (res) {
                if (res.type === 'opaqueredirect') {
                  return done({ status: 0, redirected: true, url: '(redirected — target hidden)', body: '', ctype: '' });
                }
                return res.text().then(function (body) {
                  done({
                    status: res.status,
                    ctype: res.headers.get('content-type') || '',
                    cache: res.headers.get('cache-control') || '',
                    redirected: !!res.redirected,
                    url: res.url || url,
                    body: body,
                  });
                });
              })
              .catch(function (err) {
                done({ status: -1, error: String(err && err.message ? err.message : err) });
              });
            return;
          }
          var x = new XMLHttpRequest();
          x.open('GET', url, true);
          x.onload = function () {
            done({
              status: x.status,
              ctype: x.getResponseHeader('content-type') || '',
              cache: x.getResponseHeader('cache-control') || '',
              url: x.responseURL || url,
              body: x.responseText,
            });
          };
          x.onerror = function () { done({ status: -1, error: 'network error' }); };
          x.send();
        }

        function assetsIn(html) {
          var out = [];
          var re = /(?:src|href)="(\/assets\/[^"]+)"/g;
          var m;
          while ((m = re.exec(html))) out.push(m[1]);
          return out;
        }

        // --- 1. what browser is this ------------------------------------------
        var modules = 'noModule' in document.createElement('script');
        add('info', 'Browser', navigator.userAgent);
        add(
          modules ? 'ok' : 'bad',
          modules ? 'Supports ES modules' : 'No ES module support — the app cannot run here at all',
          modules ? '' : 'The site ships one modern bundle. A browser this old will only ever show the fallback text.'
        );
        if (!window.fetch) add('info', 'No fetch API — falling back to XMLHttpRequest', 'Also an old browser.');

        // --- 2. is the origin answering, and with which build -----------------
        get('/build.txt', { cache: 'reload' }, function (r) {
          if (r.status !== 200) {
            add('bad', 'Cannot read /build.txt', 'status ' + r.status + (r.error ? ' — ' + r.error : ''));
          } else {
            add('ok', 'Origin reachable', String(r.body).replace(/\s+/g, ' ').slice(0, 120));
          }
          checkPage();
        });

        // --- 3. does the page this browser gets match the page on the server --
        function checkPage() {
          get('/', { cache: 'default' }, function (cached) {
            get('/', { cache: 'reload' }, function (fresh) {
              var a = assetsIn(cached.body || '');
              var b = assetsIn(fresh.body || '');
              add('info', 'Page cache-control', cached.cache || '(none sent)');

              if (!b.length) {
                add('bad', 'The homepage references no assets at all', 'Something replaced the page itself.');
                return finish();
              }
              if (a.join() !== b.join()) {
                add(
                  'bad',
                  'This browser was given a stale copy of the page',
                  'Cached copy asks for ' + a.join(', ') + ' — the server is serving ' + b.join(', ') +
                    '. Those old files no longer exist, so nothing loads. Something between you and the ' +
                    'site is caching pages and ignoring their cache headers.'
                );
              } else {
                add('ok', 'Page is current', b.length + ' asset(s): ' + b.join(', '));
              }
              checkAssets(b);
            });
          });
        }

        // --- 4. do the stylesheet and the bundle actually arrive --------------
        function checkAssets(list) {
          var left = list.length;
          var broken = 0;
          for (var i = 0; i < list.length; i++) {
            (function (url) {
              get(url, { cache: 'reload' }, function (r) {
                var isJs = /javascript|ecmascript/i.test(r.ctype);
                var isCss = /text\/css/i.test(r.ctype);
                var wantJs = /\.js$/.test(url);
                var good = r.status === 200 && (wantJs ? isJs : isCss);
                if (!good) broken++;
                add(
                  good ? 'ok' : 'bad',
                  (wantJs ? 'App bundle' : 'Stylesheet') + ' ' + url,
                  'status ' + r.status +
                    ', type ' + (r.ctype || 'none') +
                    ', ' + (r.body ? r.body.length : 0) + ' bytes' +
                    (r.redirected ? ' — REDIRECTED to ' + r.url : '') +
                    (r.error ? ' — ' + r.error : '') +
                    (!good && /text\/html/i.test(r.ctype)
                      ? ' — this came back as a web page, not code. Either the file is missing from the ' +
                        'deploy or something answered on its behalf.'
                      : '')
                );
                if (--left === 0) crossOriginProbe(broken);
              });
            })(list[i]);
          }
          if (!list.length) crossOriginProbe(0);
        }

        /**
         * The specific hypothesis.
         *
         * The real tags used to carry crossorigin, which turns a same-origin
         * request into a CORS one. That is harmless until something in the
         * middle answers from a different host — then the browser refuses the
         * reply instead of following it, and the stylesheet and the bundle fail
         * together while the page itself is fine. Loading the same tiny script
         * both ways says whether that is what happens here.
         */
        function crossOriginProbe(broken) {
          var url = '/diag-probe.js?t=' + Date.now();
          var plainOk = null;
          var corsOk = null;

          function done() {
            if (plainOk === null || corsOk === null) return;
            if (plainOk && !corsOk) {
              add('bad', 'Scripts load only without the crossorigin attribute',
                'This is the failure. A filter on this network is answering asset requests from ' +
                'somewhere else, and the browser rejects the cross-origin reply.');
            } else if (!plainOk && !corsOk) {
              add('bad', 'Scripts do not load either way', 'JavaScript files are being blocked outright.');
            } else {
              add('ok', 'Scripts load both with and without crossorigin', '');
            }
            finish(broken);
          }

          var s1 = document.createElement('script');
          s1.src = url;
          s1.onload = function () { plainOk = true; done(); };
          s1.onerror = function () { plainOk = false; done(); };
          document.head.appendChild(s1);

          var s2 = document.createElement('script');
          s2.src = url + '&x=1';
          s2.crossOrigin = 'anonymous';
          s2.onload = function () { corsOk = true; done(); };
          s2.onerror = function () { corsOk = false; done(); };
          document.head.appendChild(s2);

          setTimeout(function () {
            if (plainOk === null) plainOk = false;
            if (corsOk === null) corsOk = false;
            done();
          }, 8000);
        }

        function finish(broken) {
          if (broken) {
            verdict('bad',
              'The site is being served correctly and this browser is not receiving it. ' +
              'The detail above says which files were stopped — copy the report and send it on.');
          } else {
            verdict('good',
              'Everything the site needs loaded fine here. If the page still looks wrong, ' +
              'the copy in the browser cache is stale — reload with Ctrl+Shift+R.');
          }
        }

        document.getElementById('copy').onclick = function () {
          var t = document.getElementById('report');
          t.select();
          try { document.execCommand('copy'); this.textContent = 'Copied'; }
          catch (e) { this.textContent = 'Select the text below and copy it'; }
        };
      })();
    </script>
  </body>
</html>
